name: Personal image

on:
  push:
    branches:
      - michael/demand-bridge
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish personal image
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:12}"
          ctx="$(mktemp -d)"
          install -d "$ctx/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags nomsgpack \
            -trimpath \
            -ldflags "-s -w -X github.com/sablierapp/sablier/pkg/version.Version=personal-${short} -X github.com/sablierapp/sablier/pkg/version.Revision=${short} -X github.com/sablierapp/sablier/pkg/version.Branch=${GITHUB_REF_NAME} -X github.com/sablierapp/sablier/pkg/version.BuildUser=${GITHUB_ACTOR}" \
            -o "$ctx/linux/amd64/sablier" \
            ./cmd/sablier
          docker buildx build --push \
            --platform linux/amd64 \
            --file build/Dockerfile \
            --label "org.opencontainers.image.title=sablier" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${short}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/sablier:${short}" \
            "$ctx"
